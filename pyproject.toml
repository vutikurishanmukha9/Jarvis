[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "logs",
    "venv",
    "venv312",
    "workspace",
    "src/modules/career/data",
]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = [
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"src/modules/vision/vision_bridge.py" = ["E402"]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--timeout=120",
]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services or heavyweight model execution",
    "slow: tests that are expected to run longer than normal unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "venv/",
    "venv312/",
    "logs/",
    "workspace/",
    "src/modules/career/data/",
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app",
    "src.core.orchestrator",
    "src.modules.career.career_bridge",
    "src.modules.career.scorer.routes.*",
    "src.modules.career.scorer.services.analysis",
    "src.modules.career.scorer.services.model_manager",
    "src.modules.career.scorer.services.ats_helpers",
    "src.modules.career.scorer.services.ats_scorer",
    "src.modules.career.scorer.utils.keyword_extractor",
    "src.modules.career.scorer.utils.skill_extractor",
    "src.modules.vision.vision_bridge",
    "src.modules.vision.engine.*",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "venv",
    "venv312",
    "workspace",
    "src/modules/career/data",
]
skips = [
    "B101",
]
