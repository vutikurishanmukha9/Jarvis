name: Security & SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"  # Weekly security audit on Mondays
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # 1. BANDIT STATIC SECURITY SCAN (SAST)
  # ==========================================
  bandit-sast:
    name: Bandit SAST Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]>=1.7.10"

      - name: Run Bandit Security Analysis
        run: bandit -c pyproject.toml -r src app.py

  # ==========================================
  # 2. DEPENDENCY VULNERABILITY AUDIT
  # ==========================================
  dependency-audit:
    name: Supply Chain Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pip-Audit Vulnerability Scanner
        run: pip-audit --local --desc
