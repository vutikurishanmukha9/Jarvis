name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Lint
        run: ruff check app.py src tests

      - name: Format check
        run: ruff format --check app.py src tests

      - name: Type check
        run: mypy app.py src tests

      - name: Security scan
        run: bandit -c pyproject.toml -r src app.py

      - name: Dependency audit
        run: pip-audit

      - name: Tests
        run: pytest
